name: Verified release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install Flask==3.1.3 requests==2.32.5 Flask-Cors==6.0.1 bcrypt==5.0.0
      - name: Verify exact release candidate
        run: python scripts/build-check.py
      - name: Package verified committed source
        run: |
          mkdir -p release-output
          git archive --format=tar.gz --output=release-output/cleanhouse-source.tar.gz HEAD
          git rev-parse HEAD > release-output/COMMIT.txt
          cd release-output
          sha256sum cleanhouse-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source-${{ github.sha }}
          path: release-output/
          if-no-files-found: error
