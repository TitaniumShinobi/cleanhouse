<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanHouse — Account recovery</title><link rel="stylesheet" href="/css/auth.css"></head><body>
<main class="login-container"><div class="logo"><img class="brand-wordmark" src="/assets/cleanhouse.png" alt="CleanHouse"></div><h1>Recover your account</h1><p>Enter your email address. If it belongs to an account, we’ll send a reset link.</p><div id="error-message" class="error-message" role="alert"></div><div id="success-message" class="success-message" role="status"></div><form id="recovery-form"><div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><button class="login-btn" type="submit">Send recovery link</button></form><div class="signup-link"><a href="/login">Back to sign in</a></div></main><script src="/js/recovery.js"></script></body></html>
