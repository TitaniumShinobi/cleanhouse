<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanHouse — Reset password</title><link rel="stylesheet" href="/css/auth.css"></head><body>
<main class="login-container"><div class="logo"><img class="brand-wordmark" src="/assets/cleanhouse.png" alt="CleanHouse"></div><h1>Choose a new password</h1><div id="error-message" class="error-message" role="alert"></div><div id="success-message" class="success-message" role="status"></div><form id="reset-form"><div class="form-group"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-group"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></div><button class="login-btn" type="submit">Reset password</button></form><div class="signup-link"><a href="/login">Back to sign in</a></div></main><script src="/js/recovery.js"></script></body></html>
