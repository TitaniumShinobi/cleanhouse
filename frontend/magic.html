<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm CleanHouse access</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="auth-container" aria-labelledby="magic-title">
    <section class="auth-card">
      <h1 id="magic-title">Confirm CleanHouse access</h1>
      <p>This one-time link authorizes the local macOS antivirus dashboard on this Mac. It is not consumed until you confirm.</p>
      <button id="magic-confirm" type="button">Confirm access</button>
      <p id="magic-status" role="status" aria-live="polite"></p>
      <a href="/login">Return to sign in</a>
    </section>
  </main>
  <script src="/js/magic.js"></script>
</body>
</html>
